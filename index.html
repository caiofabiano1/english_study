<div id="quiz" class="hidden">

    <!-- Progress -->

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Session Panel -->

    <div class="session-card">

        <div class="stats">
            <span id="question-counter"></span>
            <span id="score"></span>
        </div>

    </div>

    <!-- Main Card -->

    <div class="card">

        <!-- Study Panel -->

        <div id="hint"></div>

        <!-- Question -->

        <div class="question-card">

            <h2 id="question"></h2>

        </div>

        <!-- Multiple Choice -->

        <div id="options"></div>

        <!-- Translation -->

        <div id="translation-area" class="hidden">

            <input
                type="text"
                id="translation-input"
                placeholder="Type the sentence in English"
                autocomplete="off"
            >

            <button id="submit-translation">
                Check Answer
            </button>

        </div>

        <!-- Feedback -->

        <div id="feedback"></div>

    </div>
